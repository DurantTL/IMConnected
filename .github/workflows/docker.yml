name: Build & publish image

# The image is built once a day (not on every merge), so a day of merges ships as one image and uses one build's worth
# of Actions minutes. The daily run skips the build when main has not changed since the last deployed image. To ship at
# once after the last merge of the day, run this workflow by hand (Actions → Build & publish image → Run workflow).
# Stories are published in the dashboard and live in the database, so story content never needs an image.
on:
  schedule:
    - cron: '43 7 * * *' # 07:43 UTC daily (2:43 a.m. Central in summer, 1:43 a.m. in winter)
  pull_request:
    branches: [main]
    paths-ignore:
      - 'src/content/stories/**'
      - 'public/images/stories/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/imconnected

# Runs on main go one at a time, and pull request test builds just restart.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.target.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Enough history to list the commits in the image (the server uses it to tell whether a republish is in the build).
          fetch-depth: 200

      # Publish only from main, and only while this commit is still main's newest. A manual
      # run on another branch, or a re-run of an old main run, must not replace :latest.
      # The daily run also skips when the deploy branch already points at this commit (nothing new
      # was merged since the last image); a manual run always builds.
      - name: Decide whether to publish
        id: target
        run: |
          publish=false
          if [ "$GITHUB_EVENT_NAME" != pull_request ] && [ "$GITHUB_REF" = refs/heads/main ] \
            && [ "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA" ]; then
            publish=true
          fi
          if [ "$publish" = true ] && [ "$GITHUB_EVENT_NAME" = schedule ] \
            && [ "$(git ls-remote origin refs/heads/deploy | cut -f1)" = "$GITHUB_SHA" ]; then
            echo "main has not changed since the last deployed image; nothing to build."
            publish=false
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

      # On pull requests: just make sure the site builds (catches bad frontmatter in submissions)
      - uses: actions/setup-node@v4
        if: github.event_name == 'pull_request'
        with:
          node-version: 22
          cache: npm
      - name: Test build
        if: github.event_name == 'pull_request'
        run: npm ci && npm run build

      # On main: build and push the Docker image
      - uses: docker/setup-buildx-action@v3
        if: steps.target.outputs.publish == 'true'
      - uses: docker/login-action@v3
        if: steps.target.outputs.publish == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Lowercase image name
        if: steps.target.outputs.publish == 'true'
        run: echo "IMAGE=${IMAGE,,}" >> "$GITHUB_ENV"
      # Still written for this release: the one-time adoption of the built stories (src/lib/story-adopt.ts) uses it to
      # settle old unpublish holds on the first start. Remove with story_holds in a later cleanup.
      - name: List the commits in this image
        if: steps.target.outputs.publish == 'true'
        run: git log -200 --format='%H %ct' > .build-commits
      - uses: docker/build-push-action@v6
        if: steps.target.outputs.publish == 'true'
        with:
          context: .
          push: true
          build-args: |
            SITE_URL=${{ vars.SITE_URL || 'https://stories.imadventist.org' }}
            PUBLIC_TURNSTILE_SITE_KEY=${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The server's host (xCloud) watches the `deploy` branch, not main. Moving it only
  # after the image is published means the server never pulls a stale :latest.
  deploy:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, so git can see that deploy is behind this commit and fast-forward it.
          # A shallow clone can't tell, and refuses the push ("fetch first").
          fetch-depth: 0
      - name: Move the deploy branch to this commit
        # A plain push only fast-forwards, so deploy can never be moved back to an older commit.
        run: git push origin "${GITHUB_SHA}:refs/heads/deploy"
